<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Sector Uncharted | IMPERIUM</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Space+Grotesk:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05080e;
    color: #f3f6fa;
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
  }
  .box {
    max-width: 540px;
    background: #0f1623;
    border: 1px solid #2b3b55;
    border-top: 4px solid #d4af37;
    padding: 3rem 2.2rem;
  }
  .kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    color: #d4af37;
    text-transform: uppercase;
    display: block;
    margin-bottom: 0.8rem;
  }
  h1 {
    font-family: 'Cinzel', serif;
    font-size: 2.4rem;
    margin-bottom: 0.8rem;
  }
  p {
    color: #94a3b8;
    font-size: 0.96rem;
    margin-bottom: 2rem;
    line-height: 1.6;
  }
  a.btn {
    display: inline-block;
    background: #d4af37;
    color: #05080e;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-decoration: none;
    padding: 0.9rem 1.8rem;
  }
  a.btn:hover { background: #ecc94b; }
</style>
</head>
<body>
  <div class="box">
    <span class="kicker">Error 404 // Coordinates Outside Perimeter</span>
    <h1>Uncharted Sector</h1>
    <p>The strategic wing you requested does not exist at these coordinates. Return to the main command deck to resume operations.</p>
    <a class="btn" href="./index.html">Return to Command Center →</a>
  </div>
</body>
</html>
